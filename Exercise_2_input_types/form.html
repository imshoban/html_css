<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Input types</title>
</head>
<body>
    <form action="">
        <div class="main-container">
            <div class="container" >
                <h1>Form design with all input types</h1>
                <hr>
                <div class="box">
                    <label for="name" >Text box :  </label><br>
                    <input type="text" name="name" id="name"><br>
                </div>

                <label for=""><input type="button" name="button" id="btn" value="Click"></label><br>

                <div class="box">
                    <label for="group-a">Group A : 
                    <input type="checkbox" name="group-a" id="group-a"></label>
                </div>    

                <div class="box">
                    <label for="group-b">Group B : 
                    <input type="checkbox" name="group-b" id="group-b"></label><br>
                </div>


                <div class="box">
                    <label for="color">Select Color : </label><br>
                    <input type="color" name="color" id="color" ><br>
                </div>

                <div class="box">
                    <label for="date">Select Date : </label><br>
                    <input type="date" name="date" id="date"><br>
                </div>

                <div class="box">
                    <label for="email">Enter email : </label><br>
                    <input type="email" name="email" id="email"><br>
                </div>

                <div class="box">
                    <label for="file">File : </label><br>
                    <input type="file" name="file" id="file"><br>
                </div>

                <div class="box">
                    <label for="image">Image : </label><br>
                <input type="image" src="" name="image" id="image"><br>
                </div>

                <div class="box">
                    <label for="month">Month Selector : </label><br>
                    <input type="month" name="month" id="month"><br>
                </div>
                
                <div class="box">
                    <label for="number">Number  : </label><br>
                <input type="number" name="number" id="number"><br>
                </div>

                <div class="box">
                    <label for="password">Password : </label><br>
                <input type="password" name="password" id="password"><br>
                </div>
                
                <div class="box">
                    <label for="set-a">Set A : </label>
                <input type="radio" name="set-a" id="set-a">
                </div>

                <div class="box">
                    <label for="set-b">Set B : </label>
                    <input type="radio" name="set-b" id="set-b"><br>
                </div>

                <div class="box">
                    <label for="range">Set B : </label>
                    <input type="range" name="range" id="range"><br>
                </div>

                <div class="box">
                    <label for="reset">Reset : </label><br>
                <input type="reset" name="reset" id="reset"><br>
                </div>

                <div class="box">
                    <label for="search">Search : </label><br>
                <input type="search" name="search" id="search"><br>
                </div>

                <div class="box">
                    <label for="submit">Submit : </label><br>
                <input type="submit" name="submit" id="submit"><br>
                </div>
            </div>
        </div>
        


    </form>
    
</body>
</html>
